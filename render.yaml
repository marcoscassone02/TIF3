services:
  - type: web
    name: grapesense
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: grapesense-db
          property: connectionString
      - key: GRAPESENSE_SECRET_KEY
        generateValue: true
      - key: GRAPESENSE_PLATFORM_ADMIN_NAME
        value: Marcos Cassone
      - key: GRAPESENSE_PLATFORM_ADMIN_EMAIL
        value: marcos123@gmail.com
      - key: GRAPESENSE_PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: MODEL_STORAGE_DIR
        value: /var/data/models
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: grapesense-models
      mountPath: /var/data/models
      sizeGB: 1

databases:
  - name: grapesense-db
    databaseName: grapesense
    user: grapesense
    plan: 0.1c-256mb
    region: virginia
    diskSizeGB: 1
    ipAllowList: []
