name: Verificación

on:
  push:
  pull_request:

jobs:
  backend-y-modelo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verificar backend
        run: >-
          python -m py_compile
          app/backend/api.py
          app/backend/core/*.py
          app/backend/ml/*.py
          app/backend/services/*.py
      - name: Evaluar modelo base
        run: >-
          python -m app.backend.ml.modelo
          app/backend/datos/evaluacion_2024.csv

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
        working-directory: app/frontend
      - run: npm run typecheck
        working-directory: app/frontend
      - run: npm run build
        working-directory: app/frontend
